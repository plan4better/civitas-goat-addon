---
# Civitas-core entry point. Loaded by core_platform/playbook.yml via a
# looped dynamic include, whose tag does not propagate — every task
# below must carry `addons` explicitly, and our own task files are
# pulled in with `import_tasks` so the tag reaches their children.
- name: "GOAT addon"
  when: inv_addons.goat.enable | default(false) | bool
  tags: ["addons"]
  block:
    - name: Include GOAT vars
      include_vars:
        dir: vars

    # geoapi and processes need controller-specific prefix stripping.
    # Without a matching profile they fall through to the `/` catch-all.
    - name: "GOAT addon: assert ingress class is supported by the profile map"
      ansible.builtin.assert:
        that: inv_k8s.ingress_class in goat_addon.ingress.profiles

    - name: "GOAT addon: create namespace and mirror the civitas CA"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/00_namespace.yml"

    - name: "GOAT addon: provision DB users (goat + windmill)"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/01_db.yml"

    # Certificate before the first Ingress so cert-manager can start the
    # ACME order before MinIO's Ingress references `<ingress-host>-tls`.
    - name: "GOAT addon: provision explicit TLS Certificate"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/06_certificate.yml"

    - name: "GOAT addon: deploy object storage (MinIO) + DuckLake volume"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/05_minio.yml"

    - name: "GOAT addon: register Keycloak client"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/02_keycloak_client.yml"

    - name: "GOAT addon: helm install"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/03_helm_install.yml"

    # Traefik-only stripPrefix Middleware CRDs. `include_tasks` so the
    # `when:` gate short-circuits the file load on other controllers.
    - name: "GOAT addon: Traefik-only — create stripPrefix Middleware CRDs"
      ansible.builtin.include_tasks: "{{ addon_dir | default('') }}tasks/04_ingress_middleware.yml"
      when: inv_k8s.ingress_class == 'traefik'

    # Handled by the chart's own post-install hooks (no addon tasks):
    #   * windmill workspace + admin password + API token
    #   * DuckLake catalog ATTACH
    #   * windmill workspace variables (POSTGRES_*, S3_*, ...)
    #   * alembic upgrade + initial_data

    - name: "GOAT addon: health check"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/99_health_check.yml"
