---
# Civitas-core entry point. Loaded by core_platform/playbook.yml via a
# looped dynamic include, whose tag does not propagate. Every task
# below must carry `addons` explicitly, and our own task files are
# pulled in with `import_tasks` so the tag reaches their children.
- name: "GOAT addon"
  when: inv_addons.goat.enable | default(false) | bool
  tags: ["addons"]
  block:
    - name: Include GOAT vars
      include_vars:
        dir: vars

    - name: "GOAT addon: create namespace and mirror the civitas CA"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/namespace.yml"

    - name: "GOAT addon: provision DB users for goat and windmill"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/db.yml"

    # Certificate before the first Ingress (goat-s3, from s3_gateway.yml)
    # so cert-manager can start the ACME order before anything references
    # `<ingress-host>-tls`.
    - name: "GOAT addon: provision explicit TLS Certificate"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/certificate.yml"

    - name: "GOAT addon: resolve S3 endpoint and credentials"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/s3_resolve.yml"

    # `import_tasks` (not include) so the `addons` tag reaches the
    # children. The `when:` copies onto every task in the file.
    - name: "GOAT addon: provision in-cluster MinIO"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/s3_provision.yml"
      when: goat_addon.s3.mode == 'provision'

    - name: "GOAT addon: publish the /<bucket> S3 gateway ingress"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/s3_gateway.yml"

    # Last S3 consumer. The bootstrap Job needs the resolved endpoint,
    # the credentials Secret and (in provision mode) the created bucket.
    - name: "GOAT addon: shared data volume"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/ducklake.yml"

    - name: "GOAT addon: configure Keycloak client"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/keycloak.yml"

    - name: "GOAT addon: helm install"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/helm_install.yml"

    # Handled by the chart itself (no addon tasks).
    # windmill workspace, admin password and API token (post-install hook).
    # DuckLake catalog bootstrap (init containers on geoapi/processes).
    # windmill workspace variables (POSTGRES_*, S3_*, ...).
    # alembic upgrade and initial_data.

    - name: "GOAT addon: health check"
      ansible.builtin.import_tasks: "{{ addon_dir | default('') }}tasks/health_check.yml"
