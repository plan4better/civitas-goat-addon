# Rendered in-memory by tasks/templates/k8s-helm.yml (via helm_install.yml)
# and passed to `helm install` as a values file.
#
# Path map (all rooted on the ingress-host).
#   /            goat-web        no rewrite
#   /core        goat-core       API_V2_STR carries the prefix, no rewrite
#   /geoapi      geoapi          nginx rewrite or traefik middleware
#   /processes   processes       nginx rewrite or traefik middleware
#   /<bucket>    S3 gateway (s3_gateway.yml). MUST equal the bucket
#                name for path-style SigV4, no rewrite.
#   windmill has no public ingress. processes reaches it in-cluster only.
{#- Derived values (hostname, TLS, S3 endpoints) come from vars/default.yml.
    s3_public_endpoint is always goat_public_url in both modes. The addon
    fronts external S3 with a `/<bucket>` Ingress in the goat namespace so
    the browser origin equals the GOAT origin (no cross-origin surface). #}
{%- set _s3 = goat_addon.s3 %}
{%- set s3_provider = goat_s3_provider %}
{%- set s3_internal_endpoint = goat_s3_endpoint %}
{%- set s3_public_endpoint = goat_public_url %}
{%- set s3_region = _s3.region %}
{%- set ingress_profile = goat_addon.ingress.profiles[inv_k8s.ingress_class] %}
{%- set is_nginx = inv_k8s.ingress_class == 'nginx' %}
{#- civitas convention. http=false (redirect on) for TLS-terminating
    ingresses. http=true (skip) when a fronting proxy already terminates. #}
{%- set ssl_redirect = 'false' if (inv_k8s.ingress.http | default(false)) else 'true' %}

global:
  # inv_k8s.storage_class is a dict ({loc, rwo, rwx}). The chart wants
  # a string. `loc` (local, single-node) is the safe default.
  storageClass: "{{ inv_k8s.storage_class.loc | default('local-path') }}"
  imagePullSecrets: []
  commonLabels:
    civitas.core/owner: goat-addon
    civitas.core/env: "{{ ENVIRONMENT }}"

{#- Image refs come from software_references.yml. The macro renders an
    `image:` block indented as a 2-space child of a top-level chart key. #}
{%- macro img(svc) -%}
image:
    registry: "{{ software.addon_goat.images[svc].registry }}"
    repository: "{{ software.addon_goat.images[svc].repository }}"
    tag: "{{ software.addon_goat.images[svc].tag }}"
    pullPolicy: "{{ software.addon_goat.images[svc].pullPolicy | default('Always') }}"
{%- endmacro %}

core:
  enabled: true
  {{ img('core') }}
  # goat-web calls the core API from the browser (NEXT_PUBLIC_API_URL
  # is baked in), so core must be reachable externally. Mounted at
  # /core. API_V2_STR carries the prefix so no controller rewrites.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
{% endif %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: /core
            pathType: Prefix
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"
  # AUTH=false. goat-core serves all data as the single default
  # identity (seeded by the chart migrate hook). goat-web's NextAuth
  # still gates UI sign-in via Keycloak. Flipping to true switches to
  # real multi-user mode and additionally requires enabling the
  # Keycloak client service account with the realm `view-users` role.
  auth:
    enabled: false
    existingSecret: goat-keycloak-creds
  # The chart's placeholder S3 values leak through if not overridden.
  # S3_PUBLIC_ENDPOINT_URL is substituted into presigned URLs returned
  # to the browser. Must be HTTPS to avoid mixed-content blocking.
  config:
    ENVIRONMENT: prod
    API_V2_STR: "/core/api/v2"
    CLIENT_URL: "{{ goat_public_url }}"
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "true"
    # Default plan + quotas feed SELF_HOSTED_PLAN_METADATA in
    # crud_organization.py. STRIPE_SECRET_KEY MUST stay unset —
    # setting it flips every new org into a 14-day Stripe trial
    # with no payment path (billing_enabled = bool(STRIPE_SECRET_KEY)).
    DEFAULT_PLAN_NAME: "goat_enterprise"
    DEFAULT_QUOTA_STORAGE_MB: "1048576"
    DEFAULT_QUOTA_PROJECTS: "10000"
    DEFAULT_QUOTA_EDITORS: "1000"
    DEFAULT_QUOTA_VIEWERS: "1000"
  extraEnv:
{% if _s3.customCACert != "" %}
    - name: AWS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: CURL_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
{% if _s3.customCACert != "" %}
  extraVolumes:
    - name: cacert
      configMap:
        name: cacert
        optional: true
  extraVolumeMounts:
    - name: cacert
      mountPath: /etc/ssl/cacert
      readOnly: true
{% endif %}

geoapi:
  enabled: true
  {{ img('geoapi') }}
  config:
    ENVIRONMENT: prod
    DUCKLAKE_CREATE_IF_NOT_EXISTS: "true"
    # geoapi fetches the realm public key from Keycloak at startup
    # via requests. Needs REQUESTS_CA_BUNDLE and SSL_CERT_FILE on
    # private-CA clusters (extraEnv below).
    AUTH: "true"
    KEYCLOAK_SERVER_URL: "{{ inv_access.platform.hostname }}"
    REALM_NAME: "{{ inv_access.tenant.realm_name }}"
    # POSTGRES_SERVER, DB and PORT are emitted by the chart's ConfigMap
    # from postgresql.external.*. Setting them here duplicates the
    # mapping key at render time. POSTGRES_USER and PASSWORD auto-wire
    # from goat-postgres-creds. POSTGRES_SERVER and PORT are overridden
    # via extraEnv (env beats envFrom) so `goat_addon.db.geoapi_host`
    # can point geoapi at a different endpoint than the rest of the stack.
    DUCKLAKE_CATALOG_SCHEMA: "ducklake"
    # Must match the DATA_PATH used by ducklake-init in ducklake.yml.
    # Parquet lives in S3. The local path is only the ATTACH marker.
    DUCKLAKE_DATA_DIR: "/app/data/ducklake"
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "true"
  extraEnv:
{% if inv_k8s.ingress.ca_path is defined and inv_k8s.ingress.ca_path != "" %}
    # Only useful with the cacert ConfigMap from namespace.yml.
    # ACME-issued chains already validate against the OpenSSL default.
    - name: REQUESTS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: SSL_CERT_FILE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}{% if _s3.customCACert != "" %}
    - name: AWS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: CURL_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}    - name: POSTGRES_SERVER
      value: "{{ goat_addon.db.geoapi_host }}"
    - name: POSTGRES_PORT
      value: "{{ goat_addon.db.geoapi_port | string }}"
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
  extraVolumes:
{% if (inv_k8s.ingress.ca_path | default('')) != '' or _s3.customCACert != '' %}
    - name: cacert
      configMap:
        name: cacert
        optional: true
{% endif %}    # Shared DuckLake data dir. worker-tools writes parquet, geoapi
    # reads it. Single RWX PVC (goat-ducklake-data, from ducklake.yml).
    - name: ducklake-data
      persistentVolumeClaim:
        claimName: goat-ducklake-data
  extraVolumeMounts:
{% if (inv_k8s.ingress.ca_path | default('')) != '' or _s3.customCACert != '' %}
    - name: cacert
      mountPath: /etc/ssl/cacert
      readOnly: true
{% endif %}    - name: ducklake-data
      mountPath: /app/data
  # Chart default is `enabled: false`. Without a readiness gate the pod
  # is published in the EndpointSlice the moment the container starts,
  # so a service that crashes before binding :8000 still receives
  # traffic and ingress-nginx returns a bare 502 (ECONNREFUSED) rather
  # than a 503 that names an unready backend. tcpSocket (not httpGet)
  # asserts only "bound to the port", which is the exact failure mode,
  # and needs no health-endpoint path.
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # geoapi at /geoapi. Path shape and prefix stripping come from the
  # ingress profile. Regex `rewrite-target` on nginx, `stripPrefix`
  # Middleware on Traefik. geoapi emits absolute URLs from
  # request.base_url (missing the prefix), but goat-web never consumes
  # them. It composes every backend URL itself from NEXT_PUBLIC_GEOAPI_URL.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
{% endif %}{% if ingress_profile.needs_middleware %}      traefik.ingress.kubernetes.io/router.middlewares: "{{ goat_addon.namespace }}-goat-strip-geoapi@kubernetescrd"
{% endif %}{% for k, v in ingress_profile.annotations.items() %}      {{ k }}: "{{ v }}"
{% endfor %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: "/geoapi{{ ingress_profile.path_suffix }}"
            pathType: "{{ ingress_profile.pathType }}"
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"

processes:
  enabled: true
  {{ img('processes') }}
  config:
    ENVIRONMENT: prod
    AUTH: "true"
    KEYCLOAK_SERVER_URL: "{{ inv_access.platform.hostname }}"
    REALM_NAME: "{{ inv_access.tenant.realm_name }}"
    # See geoapi note. Chart's ConfigMap emits POSTGRES_SERVER, DB and PORT.
    DUCKLAKE_CATALOG_SCHEMA: "ducklake"
    DUCKLAKE_DATA_DIR: "/app/data/ducklake"
    # processes declares both S3_* (boto3) and DUCKLAKE_S3_*
<<<<<<< HEAD
    # (goatlib DuckLake managers). DUCKLAKE_S3_* here stays in sync
    # with the ducklake-init Job env in ducklake.yml.
=======
    # (goatlib DuckLake managers).
>>>>>>> feat/collapse-s3-path-style-surface
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "true"
    # Full URL: goatlib's duckdb_s3_endpoint() strips the scheme and
    # uses it to derive s3_use_ssl. A scheme-less value leaves DuckDB
    # at its TLS-on default against plaintext MinIO.
    DUCKLAKE_S3_ENDPOINT: "{{ s3_internal_endpoint }}"
    DUCKLAKE_S3_BUCKET: "{{ goat_addon.s3.bucket }}"
    WINDMILL_URL: "http://goat-windmill-server"
    # Must match chart's windmill.bootstrap.workspace (default `goat`).
    WINDMILL_WORKSPACE: "goat"
  extraEnv:
{% if inv_k8s.ingress.ca_path is defined and inv_k8s.ingress.ca_path != "" %}
    - name: REQUESTS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: SSL_CERT_FILE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}{% if _s3.customCACert != "" %}
    - name: AWS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: CURL_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
    - name: DUCKLAKE_S3_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: DUCKLAKE_S3_SECRET_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
  extraVolumes:
{% if (inv_k8s.ingress.ca_path | default('')) != '' or _s3.customCACert != '' %}
    - name: cacert
      configMap:
        name: cacert
        optional: true
{% endif %}  extraVolumeMounts:
{% if (inv_k8s.ingress.ca_path | default('')) != '' or _s3.customCACert != '' %}
    - name: cacert
      mountPath: /etc/ssl/cacert
      readOnly: true
{% endif %}  # Chart default is `enabled: false`. Without a readiness gate the pod
  # is published in the EndpointSlice the moment the container starts,
  # so a service that crashes before binding :8000 still receives
  # traffic and ingress-nginx returns a bare 502 (ECONNREFUSED) rather
  # than a 503 that names an unready backend. tcpSocket (not httpGet)
  # asserts only "bound to the port", which is the exact failure mode,
  # and needs no health-endpoint path.
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # processes at /processes. Same profile-driven prefix-strip pattern as
  # geoapi. Same absolute-URL caveat. The UI composes URLs itself from
  # NEXT_PUBLIC_PROCESSES_URL.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
{% endif %}{% if ingress_profile.needs_middleware %}      traefik.ingress.kubernetes.io/router.middlewares: "{{ goat_addon.namespace }}-goat-strip-processes@kubernetescrd"
{% endif %}{% for k, v in ingress_profile.annotations.items() %}      {{ k }}: "{{ v }}"
{% endfor %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: "/processes{{ ingress_profile.path_suffix }}"
            pathType: "{{ ingress_profile.pathType }}"
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"

web:
  enabled: true
  {{ img('web') }}
  auth:
    enabled: true
    existingSecret: goat-keycloak-creds
    publicUrl: "{{ goat_public_url }}"
  extraEnv:
{% if inv_k8s.ingress.ca_path is defined and inv_k8s.ingress.ca_path != "" %}
    # NextAuth (server-side) calls Keycloak over HTTPS. Node needs
    # the CA bundle on private-CA clusters.
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/ssl/cacert/cacert.crt
{% endif %}    # entrypoint.sh substitutes APP_NEXT_PUBLIC_* placeholders in
    # the bundle at pod start. All four URLs are the PUBLIC url.
    #
    # TRAILING-SLASH ASYMMETRY (load-bearing, do not "normalise").
    #
    # NEXT_PUBLIC_API_URL is consumed as `new URL("api/v2/...", base)`
    # (organizations.ts and ~20 sites). RFC 3986 drops everything
    # after the last `/` in base. Without the trailing slash,
    # `.../core` resolves to `.../api/v2/...` and lands on goat-web
    # with an HTML 404. MUST end in `/`.
    #
    # The other three are string-concatenated with an explicit
    # leading slash. NEXT_PUBLIC_APP_URL additionally feeds
    # NEXTAUTH_URL, which rejects a trailing `/` (produces `//` in
    # callbacks and 404s). MUST NOT end in `/`.
    - name: NEXT_PUBLIC_API_URL
      value: "{{ goat_public_url }}/core/"
    - name: NEXT_PUBLIC_APP_URL
      value: "{{ goat_public_url }}"
    - name: NEXT_PUBLIC_GEOAPI_URL
      value: "{{ goat_public_url }}/geoapi"
    - name: NEXT_PUBLIC_PROCESSES_URL
      value: "{{ goat_public_url }}/processes"
{% if inv_k8s.ingress.ca_path is defined and inv_k8s.ingress.ca_path != "" %}
  extraVolumes:
    - name: cacert
      configMap:
        name: cacert
        optional: true
  extraVolumeMounts:
    - name: cacert
      mountPath: /etc/ssl/cacert
      readOnly: true
{% endif %}  # goat-web at the host root. Next.js basePath is build-time and
  # not set in this image's next.config.js. Serving under a subpath
  # would need an image fork.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
      # NextAuth's callback response embeds id_token and access_token.
      # With realm roles it exceeds ingress-nginx's 4k proxy buffer
      # and nginx returns 502 "upstream sent too big header", which
      # the browser replays as `invalid_grant (Code not valid)`.
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
{% endif %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"
    # KNOWN GOTCHA. Next.js serves /_next/static/chunks/*.js with
    # `cache-control: immutable`. entrypoint.sh sed-substitutes
    # NEXT_PUBLIC_* placeholders at pod start, mutating bytes without
    # changing filenames. Browsers that loaded pre-substitution
    # bytes keep them forever. Workaround is to clear site data after
    # any NEXT_PUBLIC_* change. Long-term fix is to regenerate chunk
    # hashes post-sed in the upstream image.

postgresql:
  operator:
    enabled: false       # civitas has Zalando cluster-wide
  cluster:
    enabled: false
  external:
    host: "{{ goat_addon.db.host }}"
    port: {{ goat_addon.db.port }}
    database: "{{ goat_addon.db.goat_db_name }}"
    existingSecret: goat-postgres-creds
    existingSecretUserKey: username
    existingSecretPasswordKey: password
    sslMode: prefer

redis:
  enabled: true
  # Bitnami's free images moved to `bitnamilegacy` in Aug 2025.
  image:
    registry: "{{ software.addon_goat.images.redis.registry }}"
    repository: "{{ software.addon_goat.images.redis.repository }}"
    tag: "{{ software.addon_goat.images.redis.tag }}"

# Windmill. Server and four workers (default, tools, workflows, print).
# Bootstrap (workspace and API token) is a chart post-install hook.
# Windmill uses its own `windmill` database (db.yml). It needs
# role-creation privileges the goat user does not have.
windmill:
  db:
    reuseGoatConnection: false
    external:
      host: "{{ goat_addon.db.windmill_host }}"
      port: {{ goat_addon.db.windmill_port }}
      database: "{{ goat_addon.db.windmill_db_name }}"
      existingSecret: windmill-postgres-creds
      existingSecretUserKey: username
      existingSecretPasswordKey: password
  scriptSync:
    enabled: true
  server:
    enabled: true
    image:
      registry: "{{ software.addon_goat.images.windmill_server.registry }}"
      repository: "{{ software.addon_goat.images.windmill_server.repository }}"
      tag: "{{ software.addon_goat.images.windmill_server.tag }}"
      pullPolicy: "{{ software.addon_goat.images.windmill_server.pullPolicy | default('Always') }}"
    # No public ingress. processes reaches windmill via WINDMILL_URL
    # in-cluster. BASE_URL points at the internal service so links
    # windmill generates are at least resolvable from other pods.
    config:
      MODE: "server"
      BASE_URL: "http://goat-windmill-server"
      DATABASE_CONNECTIONS: "5"
    ingress:
      enabled: false
  # Each goatlib-running worker needs the app DB, S3 and DuckLake
  # config. Chart v0.3.7 renamed its internal vars to _WMILL_DB_*,
  # freeing POSTGRES_* for the goat DB. WHITELIST_ENVS exposes them
  # to user scripts at runtime.
  workers:
    default:
      enabled: true
      image:
        registry: "{{ software.addon_goat.images.windmill_worker_default.registry }}"
        repository: "{{ software.addon_goat.images.windmill_worker_default.repository }}"
        tag: "{{ software.addon_goat.images.windmill_worker_default.tag }}"
        pullPolicy: "{{ software.addon_goat.images.windmill_worker_default.pullPolicy | default('Always') }}"
      config:
        DATABASE_CONNECTIONS: "3"
        NUM_WORKERS: "1"
    # `tools` and `workflows` share windmill-worker-tools (heavier,
    # bundles goatlib and geospatial deps).
    tools:
      enabled: true
      image:
        registry: "{{ software.addon_goat.images.windmill_worker_tools.registry }}"
        repository: "{{ software.addon_goat.images.windmill_worker_tools.repository }}"
        tag: "{{ software.addon_goat.images.windmill_worker_tools.tag }}"
        pullPolicy: "{{ software.addon_goat.images.windmill_worker_tools.pullPolicy | default('Always') }}"
      # `null` (not `{}`) is required to actually drop the chart
      # default `server-usage: geodata`. helm's coalesceTablesFullKey
      # merges chart keys into empty user maps, so `{}` re-inherits.
      nodeSelector: null
      tolerations: []
      # Shared DuckLake PVC. Writes here are visible to geoapi.
      persistence:
        enabled: true
        existingClaim: goat-ducklake-data
      config:
        MODE: "worker"
        WORKER_GROUP: "tools"
        WORKER_TAGS: "tools"
        DATABASE_CONNECTIONS: "3"
        NUM_WORKERS: "1"
        # DUCKDB_EXTENSION_DIRECTORY is whitelisted so job subprocesses
        # find the extensions baked at /opt/duckdb-extensions instead
        # of downloading (blocked on egress-restricted clusters).
        WHITELIST_ENVS: "POSTGRES_SERVER,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,S3_PROVIDER,S3_FORCE_PATH_STYLE,S3_ENDPOINT_URL,S3_PUBLIC_ENDPOINT_URL,S3_REGION,S3_BUCKET_NAME,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,MAX_UPLOAD_DATASET_FILE_SIZE,DUCKLAKE_CATALOG_SCHEMA,DUCKLAKE_DATA_DIR,CUSTOMER_SCHEMA,DUCKDB_EXTENSION_DIRECTORY,AWS_CA_BUNDLE,CURL_CA_BUNDLE"
        POSTGRES_SERVER: "{{ goat_addon.db.host }}"
        POSTGRES_PORT: "{{ goat_addon.db.port }}"
        POSTGRES_DB: "{{ goat_addon.db.goat_db_name }}"
        S3_PROVIDER: "{{ s3_provider }}"
        S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
        S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
        S3_REGION: "{{ s3_region }}"
        S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
        S3_FORCE_PATH_STYLE: "true"
        MAX_UPLOAD_DATASET_FILE_SIZE: "1073741824"
        DUCKLAKE_CATALOG_SCHEMA: "ducklake"
