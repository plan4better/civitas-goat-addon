# Rendered in-memory by tasks/templates/k8s-helm.yml (via helm_install.yml)
# and passed to `helm install` as a values file. Written for GOAT chart
# 0.5.x / GOAT >= v3.0.3.
#
# Path map (all rooted on the ingress-host). No controller rewrites anything:
# every service knows its own prefix and serves under it.
#   /            goat-web        host root
#   /core        goat-core       API_V2_STR carries the prefix
#   /geoapi      geoapi          ROOT_PATH=/geoapi
#   /processes   processes       ROOT_PATH=/processes
#   /catalog     catalog         ROOT_PATH=/catalog (STAC API at /catalog/stac)
#   /<bucket>    S3 gateway (s3_gateway.yml). MUST equal the bucket
#                name for path-style SigV4, no rewrite.
#   windmill has no public ingress. processes reaches it in-cluster only.
{#- Derived values (hostname, TLS, S3 endpoints) come from vars/default.yml.
    s3_public_endpoint is always goat_public_url in both modes. The addon
    fronts external S3 with a `/<bucket>` Ingress in the goat namespace so
    the browser origin equals the GOAT origin (no cross-origin surface). #}
{%- set _s3 = goat_addon.s3 %}
{%- set s3_provider = goat_s3_provider %}
{%- set s3_internal_endpoint = goat_s3_endpoint %}
{%- set s3_public_endpoint = goat_public_url %}
{%- set s3_region = _s3.region %}
{%- set is_nginx = inv_k8s.ingress_class == 'nginx' %}
{#- civitas convention. http=false (redirect on) for TLS-terminating
    ingresses. http=true (skip) when a fronting proxy already terminates. #}
{%- set ssl_redirect = 'false' if (inv_k8s.ingress.http | default(false)) else 'true' %}
{#- Two sources feed the one `cacert` ConfigMap (namespace.yml): the ingress /
    Keycloak CA and the external S3 CA. #}
{%- set has_ingress_ca = (inv_k8s.ingress.ca_path | default('')) != '' %}
{%- set has_s3_ca = _s3.customCACert != '' %}
{%- set has_cacert = has_ingress_ca or has_s3_ca %}
{#- Windmill hands job subprocesses only the env vars listed here. This is the
    chart 0.5.x default (keep it in sync when the chart changes it) plus what
    this addon adds: CUSTOMER_SCHEMA, the baked DuckDB extension dir and the
    CA bundles. #}
{%- set worker_whitelist_envs = [
      'MAX_UPLOAD_DATASET_FILE_SIZE', 'POSTGRES_SERVER', 'POSTGRES_PORT', 'POSTGRES_USER',
      'POSTGRES_PASSWORD', 'POSTGRES_DB', 'POSTGRES_DATABASE_URI', 'DUCKLAKE_DATA_DIR',
      'DUCKLAKE_CATALOG_SCHEMA', 'TILES_DATA_DIR', 'DATA_DIR', 'S3_PROVIDER',
      'S3_FORCE_PATH_STYLE', 'S3_ENDPOINT_URL', 'S3_PUBLIC_ENDPOINT_URL', 'S3_ACCESS_KEY_ID',
      'S3_SECRET_ACCESS_KEY', 'S3_BUCKET_NAME', 'S3_REGION', 'CATALOG_S3_BUCKET',
      'CATALOG_S3_ENDPOINT_URL', 'CATALOG_S3_ACCESS_KEY_ID', 'CATALOG_S3_SECRET_ACCESS_KEY',
      'CATALOG_S3_REGION', 'OD_MATRIX_BASE_PATH', 'STREET_NETWORK_EDGES_BASE_PATH',
      'STREET_NETWORK_NODES_BASE_PATH', 'PT_NETWORK_BASE_PATH', 'GTFS_DATA_PATH',
      'GEOCODING_URL', 'GEOCODING_AUTHORIZATION',
      'CUSTOMER_SCHEMA', 'DUCKDB_EXTENSION_DIRECTORY', 'AWS_CA_BUNDLE', 'CURL_CA_BUNDLE',
    ] | join(',') %}

global:
  # inv_k8s.storage_class is a dict ({loc, rwo, rwx}). The chart wants
  # a string. `loc` (local, single-node) is the safe default.
  storageClass: "{{ inv_k8s.storage_class.loc | default('local-path') }}"
  imagePullSecrets: []
  commonLabels:
    civitas.core/owner: goat-addon
    civitas.core/env: "{{ ENVIRONMENT }}"
  # One auth switch for core, web, geoapi, processes and catalog. Every
  # service validates tokens against the civitas realm; the Keycloak client
  # and this Secret (server-url, realm, client-id, client-secret,
  # nextauth-secret) come from keycloak.yml. core additionally uses the
  # client's service account (realm-management view-users + manage-users)
  # to read and update users.
  auth:
    enabled: true
    existingSecret: goat-keycloak-creds

# One shared volume at /app/data for geoapi, processes, catalog, core and the
# tools/workflows workers: DuckLake parquet (every user layer lives HERE, not
# in S3), the catalog mirror, geoip and the routing base data. The claim is
# created by ducklake.yml; back it up and size it for the layer data.
data:
  existingClaim: goat-ducklake-data

{#- Image refs come from software_references.yml. The macro renders an
    `image:` block indented as a 2-space child of a top-level chart key. #}
{%- macro img(svc) -%}
image:
    registry: "{{ software.addon_goat.images[svc].registry }}"
    repository: "{{ software.addon_goat.images[svc].repository }}"
    tag: "{{ software.addon_goat.images[svc].tag }}"
    pullPolicy: "{{ software.addon_goat.images[svc].pullPolicy | default('Always') }}"
{%- endmacro %}

{#- Ingress for a path-prefixed API service. The service sets ROOT_PATH to the
    same prefix, so no rewrite annotation or Traefik middleware is needed. #}
{%- macro api_ingress(prefix) -%}
ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
{% else %}      {}
{% endif %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: "{{ prefix }}"
            pathType: Prefix
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"
{%- endmacro %}

{#- CA trust for a Python service: REQUESTS_CA_BUNDLE/SSL_CERT_FILE for
    Keycloak (token validation, core's admin client), AWS_/CURL_CA_BUNDLE for
    the external S3. Renders `extraEnv` items (without the key). #}
{%- macro ca_env() -%}
{% if has_ingress_ca %}    - name: REQUESTS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: SSL_CERT_FILE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}{% if has_s3_ca %}    - name: AWS_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
    - name: CURL_CA_BUNDLE
      value: /etc/ssl/cacert/cacert.crt
{% endif %}
{%- endmacro %}

{%- macro ca_volumes() -%}
{% if has_cacert %}  extraVolumes:
    - name: cacert
      configMap:
        name: cacert
        optional: true
  extraVolumeMounts:
    - name: cacert
      mountPath: /etc/ssl/cacert
      readOnly: true
{% endif %}
{%- endmacro %}

core:
  enabled: true
  {{ img('core') }}
  # goat-web calls the core API from the browser (NEXT_PUBLIC_API_URL
  # is baked in), so core must be reachable externally. Mounted at
  # /core. API_V2_STR carries the prefix so no controller rewrites.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
{% else %}      {}
{% endif %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: /core
            pathType: Prefix
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"
  # The chart's placeholder S3 values leak through if not overridden.
  # S3_PUBLIC_ENDPOINT_URL is substituted into presigned URLs returned
  # to the browser. Must be HTTPS to avoid mixed-content blocking.
  config:
    ENVIRONMENT: prod
    API_V2_STR: "/core/api/v2"
    CLIENT_URL: "{{ goat_public_url }}"
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "true"
    # No cloud metadata service here: stop boto3 probing 169.254.169.254.
    AWS_EC2_METADATA_DISABLED: "true"
    # Default plan + quotas feed SELF_HOSTED_PLAN_METADATA in
    # crud_organization.py. STRIPE_SECRET_KEY MUST stay unset —
    # setting it flips every new org into a 14-day Stripe trial
    # with no payment path (billing_enabled = bool(STRIPE_SECRET_KEY)).
    DEFAULT_PLAN_NAME: "goat_enterprise"
    DEFAULT_QUOTA_STORAGE_MB: "1048576"
    DEFAULT_QUOTA_PROJECTS: "10000"
    DEFAULT_QUOTA_EDITORS: "1000"
    DEFAULT_QUOTA_VIEWERS: "1000"
  extraEnv:
{{ ca_env() }}    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
{{ ca_volumes() }}
geoapi:
  enabled: true
  {{ img('geoapi') }}
  config:
    ENVIRONMENT: prod
    # Served under /geoapi (see the path map): OGC/STAC self/next links and
    # the docs pages carry the prefix.
    ROOT_PATH: "/geoapi"
    # POSTGRES_SERVER, DB and PORT are emitted by the chart's ConfigMap
    # from postgresql.external.*. Setting them here duplicates the
    # mapping key at render time. POSTGRES_USER and PASSWORD auto-wire
    # from goat-postgres-creds. POSTGRES_SERVER and PORT are overridden
    # via extraEnv (env beats envFrom) so `goat_addon.db.geoapi_host`
    # can point geoapi at a different endpoint than the rest of the stack.
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "true"
  extraEnv:
{{ ca_env() }}    - name: POSTGRES_SERVER
      value: "{{ goat_addon.db.geoapi_host }}"
    - name: POSTGRES_PORT
      value: "{{ goat_addon.db.geoapi_port | string }}"
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
{{ ca_volumes() }}  # Chart default is `enabled: false`. Without a readiness gate the pod
  # is published in the EndpointSlice the moment the container starts,
  # so a service that crashes before binding :8000 still receives
  # traffic and ingress-nginx returns a bare 502 (ECONNREFUSED) rather
  # than a 503 that names an unready backend. tcpSocket (not httpGet)
  # asserts only "bound to the port", which is the exact failure mode,
  # and needs no health-endpoint path.
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  {{ api_ingress('/geoapi') }}

processes:
  enabled: true
  {{ img('processes') }}
  config:
    ENVIRONMENT: prod
    ROOT_PATH: "/processes"
    # See geoapi note. Chart's ConfigMap emits POSTGRES_SERVER, DB and PORT.
    # processes declares both S3_* (boto3) and DUCKLAKE_S3_*
    # (goatlib DuckLake managers).
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "true"
    # Full URL: goatlib's duckdb_s3_endpoint() strips the scheme and
    # uses it to derive s3_use_ssl. A scheme-less value leaves DuckDB
    # at its TLS-on default against plaintext MinIO.
    DUCKLAKE_S3_ENDPOINT: "{{ s3_internal_endpoint }}"
    DUCKLAKE_S3_BUCKET: "{{ goat_addon.s3.bucket }}"
    # WINDMILL_URL / WINDMILL_WORKSPACE / WINDMILL_TOKEN are wired by the
    # chart (processes.windmillAutoWire), including the bootstrap token.
  extraEnv:
{{ ca_env() }}    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
    - name: DUCKLAKE_S3_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: access_key }
    - name: DUCKLAKE_S3_SECRET_KEY
      valueFrom:
        secretKeyRef: { name: goat-s3-credentials, key: secret_key }
{{ ca_volumes() }}  # See geoapi.readinessProbe.
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  {{ api_ingress('/processes') }}

# STAC API + MCP server for the GOAT data catalog. Database-less: serves the
# catalog mirror from the shared data volume. Offline, `sync_catalog` cannot
# reach plan4better's catalog bucket, so the catalog stays empty (it answers
# an empty STAC root) until a mirror is provided.
catalog:
  enabled: true
  {{ img('catalog') }}
  config:
    ROOT_PATH: "/catalog"
{% if has_ingress_ca %}  extraEnv:
{{ ca_env() }}{% endif %}{{ ca_volumes() }}  {{ api_ingress('/catalog') }}

web:
  enabled: true
  {{ img('web') }}
  auth:
    publicUrl: "{{ goat_public_url }}"
  # Browser-facing URLs, substituted into the client bundle at pod start.
  #
  # TRAILING-SLASH ASYMMETRY (load-bearing, do not "normalise").
  #
  # `api` is consumed as `new URL("api/v2/...", base)` (organizations.ts
  # and ~20 sites). RFC 3986 drops everything after the last `/` in base.
  # Without the trailing slash, `.../core` resolves to `.../api/v2/...` and
  # lands on goat-web with an HTML 404. MUST end in `/`.
  #
  # The others are string-concatenated with an explicit leading slash and
  # MUST NOT end in `/`. `catalog` is the STAC root; set it explicitly, the
  # chart would derive `<host>/stac` without the /catalog prefix.
  publicUrls:
    api: "{{ goat_public_url }}/core/"
    geoapi: "{{ goat_public_url }}/geoapi"
    processes: "{{ goat_public_url }}/processes"
    catalog: "{{ goat_public_url }}/catalog/stac"
  extraEnv:
    # NEXT_PUBLIC_APP_URL feeds NEXTAUTH_URL, which rejects a trailing `/`
    # (produces `//` in callbacks and 404s). MUST NOT end in `/`.
    - name: NEXT_PUBLIC_APP_URL
      value: "{{ goat_public_url }}"
{% if has_ingress_ca %}    # NextAuth (server-side) calls Keycloak over HTTPS. Node needs
    # the CA bundle on private-CA clusters.
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/ssl/cacert/cacert.crt
  extraVolumes:
    - name: cacert
      configMap:
        name: cacert
        optional: true
  extraVolumeMounts:
    - name: cacert
      mountPath: /etc/ssl/cacert
      readOnly: true
{% endif %}  # goat-web at the host root. Next.js basePath is build-time and
  # not set in this image's next.config.js. Serving under a subpath
  # would need an image fork.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "{{ ssl_redirect }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
      # NextAuth's callback response embeds id_token and access_token.
      # With realm roles it exceeds ingress-nginx's 4k proxy buffer
      # and nginx returns 502 "upstream sent too big header", which
      # the browser replays as `invalid_grant (Code not valid)`.
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
{% else %}      {}
{% endif %}    hosts:
      - host: "{{ goat_ingress_host }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "{{ goat_tls_secret }}"
        hosts:
          - "{{ goat_ingress_host }}"
    # KNOWN GOTCHA. Next.js serves /_next/static/chunks/*.js with
    # `cache-control: immutable`. entrypoint.sh sed-substitutes
    # NEXT_PUBLIC_* placeholders at pod start, mutating bytes without
    # changing filenames. Browsers that loaded pre-substitution
    # bytes keep them forever. Workaround is to clear site data after
    # any NEXT_PUBLIC_* change. Long-term fix is to regenerate chunk
    # hashes post-sed in the upstream image.

postgresql:
  operator:
    enabled: false       # civitas has Zalando cluster-wide
  cluster:
    enabled: false
  external:
    host: "{{ goat_addon.db.host }}"
    port: {{ goat_addon.db.port }}
    database: "{{ goat_addon.db.goat_db_name }}"
    existingSecret: goat-postgres-creds
    existingSecretUserKey: username
    existingSecretPasswordKey: password
    sslMode: prefer

redis:
  enabled: true
  # Bitnami's free images moved to `bitnamilegacy` in Aug 2025.
  image:
    registry: "{{ software.addon_goat.images.redis.registry }}"
    repository: "{{ software.addon_goat.images.redis.repository }}"
    tag: "{{ software.addon_goat.images.redis.tag }}"

# Windmill. Server and four workers (default, tools, workflows, print).
# Bootstrap (workspace and API token) is a chart post-install hook.
# Windmill uses its own `windmill` database (db.yml). It needs
# role-creation privileges the goat user does not have.
windmill:
  db:
    reuseGoatConnection: false
    external:
      host: "{{ goat_addon.db.windmill_host }}"
      port: {{ goat_addon.db.windmill_port }}
      database: "{{ goat_addon.db.windmill_db_name }}"
      existingSecret: windmill-postgres-creds
      existingSecretUserKey: username
      existingSecretPasswordKey: password
  scriptSync:
    enabled: true
    image:
      registry: "{{ software.addon_goat.images.windmill_worker_tools.registry }}"
      repository: "{{ software.addon_goat.images.windmill_worker_tools.repository }}"
      tag: "{{ software.addon_goat.images.windmill_worker_tools.tag }}"
  server:
    enabled: true
    image:
      registry: "{{ software.addon_goat.images.windmill_server.registry }}"
      repository: "{{ software.addon_goat.images.windmill_server.repository }}"
      tag: "{{ software.addon_goat.images.windmill_server.tag }}"
      pullPolicy: "{{ software.addon_goat.images.windmill_server.pullPolicy | default('Always') }}"
    # No public ingress. processes reaches windmill via WINDMILL_URL
    # in-cluster. BASE_URL points at the internal service so links
    # windmill generates are at least resolvable from other pods.
    config:
      MODE: "server"
      BASE_URL: "http://goat-windmill-server"
      DATABASE_CONNECTIONS: "5"
    ingress:
      enabled: false
  # Each goatlib-running worker needs the app DB, S3 and DuckLake
  # config (the chart does not wire the workers). The chart's `data`
  # volume is mounted on tools and workflows at /app/data.
  # WHITELIST_ENVS exposes the variables to user scripts at runtime.
  workers:
    default:
      enabled: true
      image:
        registry: "{{ software.addon_goat.images.windmill_worker_default.registry }}"
        repository: "{{ software.addon_goat.images.windmill_worker_default.repository }}"
        tag: "{{ software.addon_goat.images.windmill_worker_default.tag }}"
        pullPolicy: "{{ software.addon_goat.images.windmill_worker_default.pullPolicy | default('Always') }}"
      config:
        DATABASE_CONNECTIONS: "3"
        NUM_WORKERS: "1"
{% for worker in ['tools', 'workflows'] %}
    # `tools` and `workflows` share windmill-worker-tools (heavier,
    # bundles goatlib and geospatial deps).
    {{ worker }}:
      enabled: true
      image:
        registry: "{{ software.addon_goat.images.windmill_worker_tools.registry }}"
        repository: "{{ software.addon_goat.images.windmill_worker_tools.repository }}"
        tag: "{{ software.addon_goat.images.windmill_worker_tools.tag }}"
        pullPolicy: "{{ software.addon_goat.images.windmill_worker_tools.pullPolicy | default('Always') }}"
      # `null` (not `{}`) is required to actually drop the chart
      # default `server-usage: geodata`. helm's coalesceTablesFullKey
      # merges chart keys into empty user maps, so `{}` re-inherits.
      nodeSelector: null
      tolerations: []
      config:
        MODE: "worker"
        WORKER_GROUP: "{{ worker }}"
        WORKER_TAGS: "{{ worker }}"
        DATABASE_CONNECTIONS: "3"
        NUM_WORKERS: "1"
        WHITELIST_ENVS: "{{ worker_whitelist_envs }}"
        POSTGRES_SERVER: "{{ goat_addon.db.host }}"
        POSTGRES_PORT: "{{ goat_addon.db.port }}"
        POSTGRES_DB: "{{ goat_addon.db.goat_db_name }}"
        S3_PROVIDER: "{{ s3_provider }}"
        S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
        S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
        S3_REGION: "{{ s3_region }}"
        S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
        S3_FORCE_PATH_STYLE: "true"
        MAX_UPLOAD_DATASET_FILE_SIZE: "1073741824"
        DUCKLAKE_CATALOG_SCHEMA: "ducklake"
        DUCKLAKE_DATA_DIR: "/app/data/ducklake"
        DATA_DIR: "/app/data"
        CUSTOMER_SCHEMA: "customer"
      extraEnv:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: goat-postgres-creds, key: username }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: goat-postgres-creds, key: password }
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: goat-s3-credentials, key: access_key }
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: goat-s3-credentials, key: secret_key }
{% if has_s3_ca %}        - name: AWS_CA_BUNDLE
          value: /etc/ssl/cacert/cacert.crt
        - name: CURL_CA_BUNDLE
          value: /etc/ssl/cacert/cacert.crt
      extraVolumes:
        - name: cacert
          configMap:
            name: cacert
            optional: true
      extraVolumeMounts:
        - name: cacert
          mountPath: /etc/ssl/cacert
          readOnly: true
{% endif %}
{% endfor %}
    print:
      enabled: true
      image:
        registry: "{{ software.addon_goat.images.windmill_worker_print.registry }}"
        repository: "{{ software.addon_goat.images.windmill_worker_print.repository }}"
        tag: "{{ software.addon_goat.images.windmill_worker_print.tag }}"
        pullPolicy: "{{ software.addon_goat.images.windmill_worker_print.pullPolicy | default('Always') }}"
      nodeSelector: {}
      config:
        DATABASE_CONNECTIONS: "3"
        NUM_WORKERS: "1"
        # print_report.py uploads to S3 and presigns a GET for the
        # browser; without these envs it falls through to an
        # unauthenticated real-AWS client. WHITELIST_ENVS is required
        # because Windmill filters the environment passed to job
        # subprocesses — an unlisted var never reaches the tool.
        WHITELIST_ENVS: "POSTGRES_SERVER,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,S3_PROVIDER,S3_FORCE_PATH_STYLE,S3_ENDPOINT_URL,S3_PUBLIC_ENDPOINT_URL,S3_REGION,S3_BUCKET_NAME,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,MAX_UPLOAD_DATASET_FILE_SIZE,DUCKLAKE_CATALOG_SCHEMA,DUCKLAKE_DATA_DIR,CUSTOMER_SCHEMA,DUCKDB_EXTENSION_DIRECTORY"
        S3_PROVIDER: "{{ s3_provider }}"
        S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
        S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
        S3_REGION: "{{ s3_region }}"
        S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
        S3_FORCE_PATH_STYLE: "true"
      extraEnv:
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: goat-s3-credentials, key: access_key }
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: goat-s3-credentials, key: secret_key }

caddy:
  enabled: false         # goat-web owns its Ingress
