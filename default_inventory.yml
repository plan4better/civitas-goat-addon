# Only keys practically every deployment sets. Defaults live in
# vars/default.yml. Schema details in the README.
---
inv_addons:
  goat:
    enable: true
    # One pin for every plan4better/goat image.
    # TODO(GOAT v3.0.9): move to "v3.0.9" once it is released.
    release: "v3.0.3"
    web:
      subdomain: "goat"
      # public_url: "https://goat.{{ DOMAIN }}"
    s3:
      # `provision` runs the chart's single-node Garage in-cluster.
      # `attach` uses an existing S3-compatible endpoint (set endpoint and credentials).
      mode: "provision"
      endpoint: ""
      access_key: ""
      secret_key: ""
      # customCACert: "{{ inventory_dir }}/s3-ca.pem"
      # bucket: "goat"
      # region: "us-east-1"
