# Only keys practically every deployment sets. Defaults live in
# vars/default.yml. Schema details in the README.
---
inv_addons:
  goat:
    enable: true
    # One pin for every plan4better/goat image.
    release: "v3.0.2"
    web:
      subdomain: "goat"
      # public_url: "https://goat.{{ DOMAIN }}"
    s3:
      # `provision` deploys a single-replica MinIO in-cluster.
      # `attach` uses an existing S3-compatible endpoint (set endpoint and credentials).
      mode: "provision"
      endpoint: ""
      access_key: ""
      secret_key: ""
