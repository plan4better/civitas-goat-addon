# Single source of truth for every image and helm artifact. Civitas-core's
# image-mirror tooling enumerates these and pushes them into a private
# registry for air-gapped deployments. Override `registry:` per image via
# inventory to point at a mirror.
---
# GOAT release tag — every plan4better/goat image must agree on it:
# geoapi, processes and windmill_worker_tools share a DuckLake catalog
# whose on-disk format is written by the DuckDB extension baked into
# each image, so a skew produces `DuckLake catalog version mismatch` at
# attach. Core / web / windmill_server / windmill_worker_* move together
# for release coherence.
#
# Top-level (not inside `software.addon_goat`) — every image tag below
# references it, and nesting the shared value in the same dict as its
# consumers triggers `recursive loop detected in template string` when
# the whole dict is templated (e.g. from an assert).
goat_release: "{{ inv_addons.goat.release | default('v2.4.60') }}"

software:
  addon_goat:
    helm_chart_name: goat
    helm_release_name: goat
    helm_repo_url: oci://ghcr.io/plan4better/charts
    helm_chart_version: "0.4.1"

    # Chart-deployed images are consumed by the chart via
    # `<svc>.image.{registry,repository,tag,pullPolicy}` in
    # templates/goat_values.yml.
    images:
      core:
        registry: ghcr.io
        repository: plan4better/goat/core
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      web:
        registry: ghcr.io
        repository: plan4better/goat/web
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      geoapi:
        registry: ghcr.io
        repository: plan4better/goat/geoapi
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      processes:
        registry: ghcr.io
        repository: plan4better/goat/processes
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      windmill_server:
        registry: ghcr.io
        repository: plan4better/goat/windmill-server
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      windmill_worker_default:
        registry: ghcr.io
        repository: plan4better/goat/windmill-worker-default
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      # Shared by `tools` and `workflows` worker pods.
      windmill_worker_tools:
        registry: ghcr.io
        repository: plan4better/goat/windmill-worker-tools
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent
      windmill_worker_print:
        registry: ghcr.io
        repository: plan4better/goat/windmill-worker-print
        tag: "{{ goat_release }}"
        pullPolicy: IfNotPresent

      # Free Bitnami images moved to bitnamilegacy in Aug 2025.
      redis:
        registry: docker.io
        repository: bitnamilegacy/redis
        tag: "8.0.2"
        pullPolicy: IfNotPresent

      # Addon-deployed (05_minio.yml), not via the chart.
      minio:
        registry: quay.io
        repository: minio/minio
        tag: RELEASE.2025-09-07T16-13-09Z
        pullPolicy: IfNotPresent
      minio_mc:
        registry: quay.io
        repository: minio/mc
        tag: RELEASE.2025-08-13T08-35-41Z
        pullPolicy: IfNotPresent
