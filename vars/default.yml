---
addon_dir: "addons/goat_addon/"

# Hoisted out of `goat_addon` to avoid a self-referential template loop
# when a sibling key resolves this FQDN during rendering.
goat_central_db_fqdn: "{{ (inv_addons.goat.db.central_db_name | default('central-db')) + '.' + inv_central_db.ns_name + '.svc.cluster.local' }}"

goat_addon:
  namespace: "{{ inv_addons.goat.namespace | default(ENVIRONMENT + '-goat-stack') }}"
  ns_create: "{{ inv_addons.goat.ns_create | default(true) }}"
  # Resolved against K8S_KUBECONFIG_PATH in 00_namespace.yml.
  ns_kubeconfig: "{{ inv_addons.goat.ns_kubeconfig | default(kubeconfig_file) }}"
  # Default pulls the chart from plan4better's public OCI registry.
  # Override `chart.ref` to a filesystem path for offline installs.
  chart:
    ref: "{{ inv_addons.goat.chart.ref | default(software.addon_goat.helm_repo_url + '/' + software.addon_goat.helm_chart_name) }}"
    version: "{{ inv_addons.goat.chart.version | default(software.addon_goat.helm_chart_version) }}"
  db:
    central_db_ns: "{{ inv_central_db.ns_name }}"
    # Zalando cluster NAME, not an endpoint. 01_db.yml derives per-DB
    # credential Secret names from this and runs psql via k8s_exec in
    # the master pod, so it must stay the cluster name regardless of
    # any per-service host override below.
    central_db_name: "{{ inv_addons.goat.db.central_db_name | default('central-db') }}"
    # Runtime Postgres endpoint the workloads dial. Provisioning in
    # 01_db.yml is unaffected — it never reads host/port.
    host: "{{ inv_addons.goat.db.host | default(goat_central_db_fqdn) }}"
    port: "{{ inv_addons.goat.db.port | default(5432) | int }}"
    # Per-service override for windmill. Defaults to `host`/`port`.
    # Nested default() on purpose — a chained `| default | default`
    # picks the wrong fallback when `host` is set but `windmill_host`
    # is not.
    windmill_host: "{{ inv_addons.goat.db.windmill_host | default(inv_addons.goat.db.host | default(goat_central_db_fqdn)) }}"
    windmill_port: "{{ inv_addons.goat.db.windmill_port | default(inv_addons.goat.db.port | default(5432)) | int }}"
    # Per-service override for geoapi. Defaults to `host`/`port`.
    geoapi_host: "{{ inv_addons.goat.db.geoapi_host | default(inv_addons.goat.db.host | default(goat_central_db_fqdn)) }}"
    geoapi_port: "{{ inv_addons.goat.db.geoapi_port | default(inv_addons.goat.db.port | default(5432)) | int }}"
    # windmill role names (windmill_admin, windmill_user) are
    # hardcoded by its migrations regardless of db name, so two
    # installs sharing one cluster collide on roles.
    goat_db_name: "{{ inv_addons.goat.db.goat_db_name | default('goat') }}"
    windmill_db_name: "{{ inv_addons.goat.db.windmill_db_name | default('windmill') }}"
  keycloak:
    client_id: "{{ inv_addons.goat.keycloak.client_id | default('goat-web') }}"
  web:
    # ingress-host = <subdomain>.<INGRESS_DOMAIN | DOMAIN>
    # public URL   = https://<subdomain>.<DOMAIN>
    subdomain: "{{ inv_addons.goat.web.subdomain | default('goat') }}"
    # Browser-facing URL (NEXT_PUBLIC_*, Keycloak redirectUris,
    # presigned S3). Override only if it must differ from the default.
    public_url: "{{ inv_addons.goat.web.public_url | default('https://' + (inv_addons.goat.web.subdomain | default('goat')) + '.' + DOMAIN) }}"
  s3:
    bucket: "{{ inv_addons.goat.s3.bucket | default('goat') }}"
    # in_cluster: single-replica MinIO in-namespace (not HA).
    # external:   any S3-compatible endpoint; requires access_key,
    #             secret_key, region, and a pre-existing bucket.
    mode: "{{ inv_addons.goat.s3.mode | default('in_cluster') }}"
    # Cluster-internal endpoint (external mode). The browser-facing
    # URL is always goat_public_url — the addon runs a `/<bucket>`
    # Ingress that proxies here.
    endpoint: "{{ inv_addons.goat.s3.endpoint | default('') }}"
    # Required non-empty in external mode. Source from ansible-vault;
    # the addon writes them into `goat-s3-credentials`.
    access_key: "{{ inv_addons.goat.s3.access_key | default('') }}"
    secret_key: "{{ inv_addons.goat.s3.secret_key | default('') }}"
    region: "{{ inv_addons.goat.s3.region | default('us-east-1') }}"
    # goat-core branches on this: `aws` for real AWS S3, `minio`
    # for everything else (MinIO / R2 / Wasabi / Backblaze / …).
    provider: "{{ inv_addons.goat.s3.provider | default('minio') }}"
    # Path-style for MinIO / R2 / Wasabi / Backblaze; vhost-style
    # for AWS S3 buckets created after path-style deprecation.
    force_path_style: "{{ inv_addons.goat.s3.force_path_style | default(true) | bool }}"
    # Tunables for the `/<bucket>` passthrough Ingress (05_minio.yml).
    proxy:
      # ingress-nginx defaults to 1 MB, which 413s any real upload.
      max_body_size: "{{ inv_addons.goat.s3.proxy.max_body_size | default('5g') }}"
      # No-op unless a `proxy-ssl-secret` (client-CA) is provisioned
      # separately — the addon does not create one. Only consulted
      # when s3.endpoint is https://.
      ssl_verify: "{{ inv_addons.goat.s3.proxy.ssl_verify | default(false) | bool }}"
      # SNI for the upstream TLS handshake. Empty → 05_minio.yml
      # derives it from `s3.endpoint`'s hostname. ingress-nginx's
      # built-in default is the literal `upstream_balancer`, which
      # no S3 endpoint serves a cert for.
      ssl_name: "{{ inv_addons.goat.s3.proxy.ssl_name | default('') }}"
      # `Host` header sent to the upstream:
      #   None → 05_minio.yml uses `goat_public_host` (SigV4 signs
      #          the host on presigned GETs, so pods must see the
      #          same value the browser signed against)
      #   ""   → annotation omitted; ingress-nginx forwards the
      #          client-supplied Host verbatim
      #   any  → literal upstream-vhost value
      upstream_vhost: "{{ inv_addons.goat.s3.proxy.upstream_vhost | default(None) }}"
  ducklake:
    pvc_size: "{{ inv_addons.goat.ducklake.pvc_size | default('20Gi') }}"
    # RWX for multi-node clusters; local-path (k3d/k3s) cannot
    # provision RWX — set ReadWriteOnce there.
    pvc_access_mode: "{{ inv_addons.goat.ducklake.pvc_access_mode | default('ReadWriteMany') }}"
    # Block-backed classes (Ceph RBD, EBS, GCE PD, Azure Disk) cannot
    # satisfy ReadWriteMany — the PVC then sits Pending forever.
    storage_class: "{{ inv_addons.goat.ducklake.storage_class | default(inv_k8s.storage_class.rwx) }}"
  # Controller-specific prefix stripping for the two services without
  # FastAPI root_path support (geoapi, processes). Selected by
  # inv_k8s.ingress_class; tasks.yml asserts unknown values.
  ingress:
    # traefik.io/v1alpha1 (v3, default) or traefik.containo.us/v1alpha1 (v2).
    traefik_api_group: "{{ inv_addons.goat.ingress.traefik_api_group | default('traefik.io/v1alpha1') }}"
    profiles:
      nginx:
        # Annotation-driven regex rewrite.
        path_suffix: "(/|$)(.*)"
        pathType: "ImplementationSpecific"
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: "/$2"
          nginx.ingress.kubernetes.io/use-regex: "true"
        needs_middleware: false
      traefik:
        # Traefik has no annotation-level path rewrite. Stripping
        # requires a stripPrefix Middleware CRD referenced by each
        # ingress. Annotation format `<ns>-<name>@kubernetescrd`
        # is mandatory and fails silently if wrong.
        path_suffix: ""
        pathType: "Prefix"
        annotations: {}
        needs_middleware: true
  health_check:
    retries: 30
    delay_seconds: 10

# ---------------------------------------------------------------------------
# Derived values. Consumed by templates/goat_values.yml, 05_minio.yml,
# 06_certificate.yml. Top-level (not inside `goat_addon`) for the same
# recursion reason as `goat_central_db_fqdn` above.
#
# Reverse-proxy topology: ingress-host is what the cluster ingress
# controller sees (SNI + Host + TLS cert); public host is what the
# browser sees. With no fronting proxy the two coincide.
goat_ingress_host: "{{ (goat_addon.web.subdomain | default('goat')) + '.' + (INGRESS_DOMAIN | default(DOMAIN)) }}"
# Subdomain/domain changes rotate to a new secret; the old one lingers.
goat_tls_secret: "{{ goat_ingress_host }}-tls"
goat_public_url: "{{ goat_addon.web.public_url }}"
goat_public_host: "{{ goat_public_url | regex_replace('^https?://', '') | regex_replace('/+$', '') }}"

# Cluster-internal S3 endpoint. Trailing slash forbidden — consumers
# concatenate `/<bucket>/<key>` and SigV4 signs the canonical URI,
# so a double slash breaks every signature.
goat_s3_internal_endpoint: >-
  {{ (goat_addon.s3.endpoint
      if goat_addon.s3.mode == 'external'
      else 'http://minio.' + goat_addon.namespace + '.svc.cluster.local:9000')
     | trim | regex_replace('/+$', '') }}
# host:port form for DuckDB's `s3_endpoint` (wants no scheme).
goat_s3_endpoint_hostport: "{{ goat_s3_internal_endpoint | regex_replace('^https?://', '') }}"
# in_cluster is always plain http; external follows the operator's scheme.
goat_s3_endpoint_is_tls: "{{ goat_addon.s3.mode == 'external' and goat_addon.s3.endpoint.startswith('https://') }}"
goat_s3_use_ssl: "{{ 'true' if (goat_s3_endpoint_is_tls | bool) else 'false' }}"
# in-cluster MinIO is path-style regardless of `force_path_style`.
goat_s3_url_style: "{{ 'vhost' if (goat_addon.s3.mode == 'external' and not goat_addon.s3.force_path_style) else 'path' }}"

# MUST equal `/` + bucket name: path-style SigV4 signs the canonical
# URI, so any other prefix breaks every presigned URL.
goat_s3_ingress_path: "/{{ goat_addon.s3.bucket }}"
# Three-state per the `upstream_vhost` knob above.
goat_s3_upstream_vhost: "{{ goat_public_host if (goat_addon.s3.proxy.upstream_vhost is none) else goat_addon.s3.proxy.upstream_vhost }}"
# Default SNI to the endpoint hostname; ingress-nginx's built-in
# default resolves to the literal `upstream_balancer`.
goat_s3_proxy_ssl_name: "{{ goat_addon.s3.proxy.ssl_name if (goat_addon.s3.proxy.ssl_name | length > 0) else (goat_addon.s3.endpoint | urlsplit('hostname') | default('', true)) }}"

# Upstream port for the `/<bucket>` proxy. Split into named steps and
# only referenced inside block-scalar `definition: |` strings so the
# k8s module parses it as a native int — jinja2 without jinja2_native
# stringifies it in inline dicts and the API server rejects
# `port: "9000"`.
goat_s3_endpoint_port: "{{ goat_addon.s3.endpoint | urlsplit('port') }}"
goat_s3_scheme_default_port: "{{ 443 if (goat_s3_endpoint_is_tls | bool) else 80 }}"
goat_s3_upstream_port: "{{ 9000 if goat_addon.s3.mode == 'in_cluster' else (goat_s3_endpoint_port | default(goat_s3_scheme_default_port, true) | int) }}"
