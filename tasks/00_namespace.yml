---
# Civitas convention: set k8s_config / k8s_context / k8s_namespace once,
# then reuse them for every kubernetes.core.* call and shared helper.
- name: "GOAT addon: set default facts for K8S"
  ansible.builtin.set_fact:
    k8s_config: "{{ K8S_KUBECONFIG_PATH }}/{{ goat_addon.ns_kubeconfig }}"
    k8s_context: "{{ inv_k8s.config.context }}"
    k8s_namespace: "{{ goat_addon.namespace }}"

# Uses the shared helper so `inv_k8s.podSecurityAdmission.enable` is
# honoured (stamps `pod-security.kubernetes.io/enforce: restricted`).
- name: "GOAT addon: create a k8s namespace"
  ansible.builtin.include_tasks: tasks/templates/k8s-namespace.yml
  when: goat_addon.ns_create | bool

# NextAuth (goat-web) makes server-side OIDC calls to Keycloak. On
# private-CA clusters Node.js rejects the cert with
# UNABLE_TO_VERIFY_LEAF_SIGNATURE — mirror the civitas CA bundle into
# the namespace and mount it via NODE_EXTRA_CA_CERTS / REQUESTS_CA_BUNDLE
# / SSL_CERT_FILE in goat_values.yml.
- name: "GOAT addon: Create cacert ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cacert
        namespace: "{{ k8s_namespace }}"
      data:
        cacert.crt: |
          {{ lookup('file', inv_k8s.ingress.ca_path) }}
  when: inv_k8s.ingress.ca_path is defined and inv_k8s.ingress.ca_path != ""
