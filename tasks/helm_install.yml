---
# Uses the civitas helm wrapper. Values are rendered via
# lookup('template') in-memory. `helm_values_rcombine` lets operators
# override any key from `inv_addons.goat.helm_values` without forking.
#
# Chart version: an OCI reference (the default) is installed with
# `--version {{ goat_addon.chart.version }}` -- without it helm resolves OCI to
# the newest chart, whatever its values contract. A local .tgz path (offline
# installs) pins itself, so it goes through the wrapper's local-chart branch
# with no version. `helm_repo_name` stays unset either way.

# The chart keeps the Redis password itself: it generates `goat-redis` on
# install and reads it back on every upgrade (the module runs helm with
# cluster access).

- name: Helm create the GOAT installation (OCI chart, pinned version)
  ansible.builtin.include_tasks: tasks/templates/k8s-helm.yml
  when: goat_addon.chart.ref is match('oci://')
  vars:
    helm_chart_name: "{{ software.addon_goat.helm_chart_name }}"
    helm_release_name: "{{ software.addon_goat.helm_release_name }}"
    helm_chart_reference: "{{ goat_addon.chart.ref }}"
    helm_chart_version: "{{ goat_addon.chart.version }}"
    helm_values_file: "{{ addon_dir | default('') }}templates/goat_values.yml"
    helm_values_rcombine: "{{ inv_addons.goat.helm_values | default({}) }}"
    helm_create_namespace: false

- name: Helm create the GOAT installation (local chart archive)
  ansible.builtin.include_tasks: tasks/templates/k8s-helm.yml
  when: goat_addon.chart.ref is not match('oci://')
  vars:
    helm_chart_name: "{{ software.addon_goat.helm_chart_name }}"
    helm_release_name: "{{ software.addon_goat.helm_release_name }}"
    helm_chart_reference: "{{ goat_addon.chart.ref }}"
    helm_values_file: "{{ addon_dir | default('') }}templates/goat_values.yml"
    helm_values_rcombine: "{{ inv_addons.goat.helm_values | default({}) }}"
    helm_create_namespace: false
