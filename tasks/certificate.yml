---
# One explicit Certificate for the whole goat stack instead of
# cert-manager's ingress-shim. With per-Ingress cluster-issuer
# annotations, the shim created five Certificates racing to
# reconcile the same Secret, and stale SANs sometimes served after
# a subdomain change (surfaced only as `400 Bad Request` in the
# controller log). `secretName` derives from `goat_ingress_host` so
# host changes rotate to a new secret. Each Ingress keeps only its
# `tls:` block. The cluster-issuer annotation must stay off.
- name: "GOAT addon: create explicit Certificate for {{ goat_ingress_host }}"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ goat_tls_secret }}"
        namespace: "{{ k8s_namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
          app.kubernetes.io/name: goat
          app.kubernetes.io/part-of: goat
      spec:
        secretName: "{{ goat_tls_secret }}"
        issuerRef:
          kind: ClusterIssuer
          name: "{{ inv_k8s.cert_manager.issuer_name }}"
        dnsNames:
          - "{{ goat_ingress_host }}"
