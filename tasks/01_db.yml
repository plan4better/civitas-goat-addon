---
# Patch the shared civitas central-db CR with two prepared databases:
#   - goat_addon.db.goat_db_name      → goat-core/geoapi/processes
#   - goat_addon.db.windmill_db_name  → windmill server + workers
#
# Zalando's `preparedDatabases.defaultUsers: true` auto-creates
# <db>_{owner,reader,writer} roles and matching credential Secrets.
#
# Windmill quirks:
#   - `windmill_admin` / `windmill_user` role names are hardcoded by
#     windmill's migrations regardless of DB name.
#   - Queries run as `SET ROLE windmill_admin`; admin must inherit
#     the table-level grants issued to windmill_user.
#   - sqlx doesn't follow Zalando's per-DB search_path override —
#     suppress the default `data` schema and pin search_path=public.

# Bare-platform default OOM-loops once goat's ~40 tables plus
# windmill's ~100 land. Fail early with a pointer instead of a
# CrashLoopBackOff mid-install.
- name: Pre-flight check — central-db has enough memory headroom for goat
  vars:
    central_db_mem_limit: "{{ inv_central_db.resources.limits.memory | default('5Gi') }}"
    # Suffix-stripped Gi/Mi to MiB — the only units civitas-core uses.
    central_db_mem_mib: >-
      {{ (central_db_mem_limit | regex_replace('Gi$', '') | int * 1024)
         if central_db_mem_limit.endswith('Gi')
         else (central_db_mem_limit | regex_replace('Mi$', '') | int) }}
  ansible.builtin.fail:
    msg: |-
      inv_central_db.resources.limits.memory is {{ central_db_mem_limit }} — too small
      for goat. Goat-core's schema (40+ tables, 5 schemas) plus windmill's
      ~100 tables push postgres past this limit and the master will OOM-loop.
      Bump inv_central_db.resources to at least:
        requests: { cpu: 200m, memory: 1Gi }
        limits:   { cpu: 2,    memory: 4Gi }
  when: (central_db_mem_mib | int) < 2048

# Ansible doesn't template YAML dict KEYS — build the dict in a
# single Jinja expression instead.
- name: Build preparedDatabases patch
  ansible.builtin.set_fact:
    goat_prepared_db_patch: >-
      {{ {
        goat_addon.db.goat_db_name: {
          'defaultUsers': true,
          'extensions': {'postgis': 'public', 'postgis_topology': 'topology'}
        },
        goat_addon.db.windmill_db_name: {
          'defaultUsers': true,
          'schemas': {'public': {'defaultRoles': false}}
        }
      } }}

# central-db is a shared CR (also written by core_platform + airflow_addon).
# `state: patched` merges without pruning siblings; `apply: true` would
# strip other components' entries, `state: present` would create a
# malformed CR from a fragment.
- name: Patch civitas central-db with prepared databases
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ goat_addon.db.central_db_ns }}"
    definition:
      apiVersion: acid.zalan.do/v1
      kind: postgresql
      metadata:
        name: "{{ goat_addon.db.central_db_name }}"
      spec:
        preparedDatabases: "{{ goat_prepared_db_patch }}"

- name: Wait for goat owner-user secret to be created by postgres-operator
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ goat_addon.db.central_db_ns }}"
    name: "{{ goat_addon.db.goat_db_name }}-owner-user.{{ goat_addon.db.central_db_name }}.credentials.postgresql.acid.zalan.do"
  register: goat_db_secret
  retries: 30
  delay: 5
  until: goat_db_secret.resources | length > 0

- name: Wait for windmill owner-user secret to be created by postgres-operator
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ goat_addon.db.central_db_ns }}"
    name: "{{ goat_addon.db.windmill_db_name }}-owner-user.{{ goat_addon.db.central_db_name }}.credentials.postgresql.acid.zalan.do"
  register: windmill_db_secret
  retries: 30
  delay: 5
  until: windmill_db_secret.resources | length > 0

- name: Copy DB owner-user secrets into the goat namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.k8s_secret_name }}"
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      type: Opaque
      data:
        username: "{{ item.zalando_secret.resources[0].data.username }}"
        password: "{{ item.zalando_secret.resources[0].data.password }}"
  loop:
    - k8s_secret_name: goat-postgres-creds
      zalando_secret: "{{ goat_db_secret }}"
    - k8s_secret_name: windmill-postgres-creds
      zalando_secret: "{{ windmill_db_secret }}"
  loop_control:
    label: "{{ item.k8s_secret_name }}"

- name: Find central-db primary pod
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Pod
    namespace: "{{ goat_addon.db.central_db_ns }}"
    label_selectors:
      - "application=spilo"
      - "spilo-role=master"
  register: central_db_master

# Zalando sometimes creates the owner-user secret before the DB is
# reachable — wait until psql can connect.
- name: Wait for windmill database to be queryable
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ goat_addon.db.central_db_ns }}"
    pod: "{{ central_db_master.resources[0].metadata.name }}"
    container: postgres
    command: >-
      psql -U {{ goat_addon.db.windmill_db_name }}_owner_user
      -d {{ goat_addon.db.windmill_db_name }}
      -tAc "SELECT 1"
  register: windmill_db_ping
  changed_when: false
  failed_when: false
  retries: 30
  delay: 5
  until: windmill_db_ping.return_code | default(1) == 0

- name: Wait for goat database to be queryable
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ goat_addon.db.central_db_ns }}"
    pod: "{{ central_db_master.resources[0].metadata.name }}"
    container: postgres
    command: >-
      psql -U {{ goat_addon.db.goat_db_name }}_owner_user
      -d {{ goat_addon.db.goat_db_name }}
      -tAc "SELECT 1"
  register: goat_db_ping
  changed_when: false
  failed_when: false
  retries: 30
  delay: 5
  until: goat_db_ping.return_code | default(1) == 0

# Civitas's spilo installs uuid-ossp in the `extensions` schema, not
# `public`. Goat's alembic migration calls `uuid_generate_v4()`
# unqualified, so search_path must include `extensions`.
- name: "Set up goat prereqs (search_path to resolve uuid-ossp in extensions schema)"
  vars:
    goat_prereq_sql: |
      CREATE SCHEMA IF NOT EXISTS extensions;
      CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
      ALTER ROLE {{ goat_addon.db.goat_db_name }}_owner_user
        IN DATABASE {{ goat_addon.db.goat_db_name }}
        SET search_path = data, public, extensions;
      GRANT USAGE ON SCHEMA extensions TO PUBLIC;
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ goat_addon.db.central_db_ns }}"
    pod: "{{ central_db_master.resources[0].metadata.name }}"
    container: postgres
    command: >-
      psql -U {{ goat_addon.db.goat_db_name }}_owner_user
      -d {{ goat_addon.db.goat_db_name }}
      -v ON_ERROR_STOP=1 --single-transaction
      -c {{ goat_prereq_sql | quote }}
  changed_when: false

- name: "Set up windmill prereqs (roles, search_path)"
  vars:
    # windmill_admin / windmill_user are hardcoded in windmill's
    # migrations; <db>_owner_user follows the DB name.
    windmill_prereq_sql: |
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'windmill_admin') THEN
          CREATE ROLE windmill_admin WITH NOLOGIN BYPASSRLS;
        ELSE
          ALTER ROLE windmill_admin BYPASSRLS;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'windmill_user') THEN
          CREATE ROLE windmill_user WITH NOLOGIN;
        END IF;
        /* SET ROLE windmill_admin runtime path: admin must inherit
           windmill_user table grants from the migrations. */
        GRANT windmill_user TO windmill_admin;
        GRANT windmill_admin TO {{ goat_addon.db.windmill_db_name }}_owner_user;
        GRANT windmill_user  TO {{ goat_addon.db.windmill_db_name }}_owner_user;
      END $$;
      ALTER ROLE {{ goat_addon.db.windmill_db_name }}_owner_user
        IN DATABASE {{ goat_addon.db.windmill_db_name }} SET search_path = public;
      ALTER DATABASE {{ goat_addon.db.windmill_db_name }} SET search_path = public;
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ goat_addon.db.central_db_ns }}"
    pod: "{{ central_db_master.resources[0].metadata.name }}"
    container: postgres
    command: >-
      psql -U postgres -d {{ goat_addon.db.windmill_db_name }}
      -v ON_ERROR_STOP=1 --single-transaction
      -c {{ windmill_prereq_sql | quote }}
  changed_when: false
