---
# Provisions the GOAT OIDC client in civitas's Keycloak and writes
# `goat-keycloak-creds` (server-url, realm, client-id, client-secret,
# nextauth-secret) into the goat namespace. Consumed by the chart via
# `auth.existingSecret`.
#
# When keycloak.limit_access is true, additionally provisions the login
# gate. A client role, a group mapping it, and a browser flow deny
# authentication to users without the role (tail of this file).

# civitas 1.5 does not ship tasks/templates/keycloak_login.yaml. The
# same flow is inlined here as in the airflow addon.
- name: "GOAT addon: get platform admin credentials"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    kind: Secret
    namespace: "{{ inv_access.ns_name }}"
    name: "{{ inv_access.platform.k8s_secret_name }}"
  register: admin_credentials

- name: "GOAT addon: store platform admin credentials"
  ansible.builtin.set_fact:
    ADMIN_USERNAME: "{{ admin_credentials.resources[0].data.MASTER_USERNAME | b64decode }}"
    ADMIN_PASSWORD: "{{ admin_credentials.resources[0].data.MASTER_PASSWORD | b64decode }}"
    cacheable: yes

- name: "GOAT addon: login to civitas Keycloak as platform admin"
  check_mode: no
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/realms/master/protocol/openid-connect/token"
    return_content: yes
    body_format: form-urlencoded
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body:
      grant_type: "password"
      client_id: "admin-cli"
      username: "{{ ADMIN_USERNAME }}"
      password: "{{ ADMIN_PASSWORD }}"
    status_code: 200
  register: keycloak_login

- name: "GOAT addon: create goat-web client"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body: "{{ lookup('template', playbook_dir + '/addons/goat_addon/templates/goat-keycloak-client.json.j2') }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 201,409
  register: client_goat_response

- name: "GOAT addon: note if goat-web client already exists"
  debug:
    msg: "goat-web client already exists in realm {{ inv_access.tenant.realm_name }}."
  when:
    - not ansible_check_mode
    - client_goat_response.status == 409

- name: "GOAT addon: get clients"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 200
  register: clients

- name: "GOAT addon: get goat-web client ID"
  set_fact:
    client_id_goat: "{{ clients.json | json_query(query) }}"
  vars:
    query: "[?clientId== '{{ goat_addon.keycloak.client_id }}'].id | [0]"

# The login gate's browser-flow binding lives on the client. The PUT below
# sends the template, which has no binding, so carry the current one over:
# otherwise a run that fails after the PUT would leave the gate unbound,
# i.e. open to every user in the realm.
- name: "GOAT addon: read current goat-web flow binding"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: goat_kc_client_before

# PUT on every run so hostname, subdomain and public_url changes take
# effect. POST-once-then-409 froze redirectUris at first create, and
# any later change surfaced as `invalid parameter: redirect_uri`.
# The client secret lives on a separate endpoint and is not rotated.
- name: "GOAT addon: update goat-web client, idempotent host and URL refresh"
  uri:
    method: PUT
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}"
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    # The template lookup returns a dict on some Ansible versions (2.18) and a
    # JSON string on others (2.19): parse only when it is a string.
    body: >-
      {% set tpl = lookup('template', playbook_dir + '/addons/goat_addon/templates/goat-keycloak-client.json.j2') %}{{
         (tpl if tpl is mapping else tpl | from_json)
         | combine({'authenticationFlowBindingOverrides':
                    goat_kc_client_before.json.authenticationFlowBindingOverrides | default({})}) }}
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 204

# core runs with AUTH on and uses this client's service account (client
# credentials grant) to read users (profile enrichment) and to update or
# delete them (profile edits, account deletion). That needs the
# realm-management roles view-users and manage-users. Adding a mapping that
# already exists is a no-op (204), so this is safe on every run.
- name: "GOAT addon: service account roles for core"
  block:
    - name: "GOAT addon: get the goat-web service-account user"
      check_mode: no
      uri:
        method: GET
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}/service-account-user"
        return_content: yes
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 200
      register: goat_kc_sa_user

    - name: "GOAT addon: get the realm-management client"
      check_mode: no
      uri:
        method: GET
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients?clientId=realm-management"
        return_content: yes
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 200
      register: goat_kc_realm_mgmt

    - name: "GOAT addon: get the view-users and manage-users roles"
      check_mode: no
      uri:
        method: GET
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ goat_kc_realm_mgmt.json[0].id }}/roles/{{ item }}"
        return_content: yes
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 200
      loop: ["view-users", "manage-users"]
      register: goat_kc_mgmt_roles

    - name: "GOAT addon: map view-users and manage-users onto the service account"
      uri:
        method: POST
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/users/{{ goat_kc_sa_user.json.id }}/role-mappings/clients/{{ goat_kc_realm_mgmt.json[0].id }}"
        body_format: json
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        body: "{{ goat_kc_mgmt_roles.results | map(attribute='json') | list }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 204

- name: "GOAT addon: fetch goat-web client secret"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}/client-secret"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 200
  register: keycloak_client_secret_response

- name: "GOAT addon: extract Keycloak client secret"
  set_fact:
    client_secret: "{{ keycloak_client_secret_response.json.value }}"

# NEXTAUTH_SECRET signs NextAuth session tokens. Generated once and
# kept alongside the Keycloak client secret. Reused on re-runs.
- name: "GOAT addon: generate or fetch a stable NEXTAUTH_SECRET"
  block:
    - name: "GOAT addon: check for existing goat-keycloak-creds"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        api_version: v1
        kind: Secret
        namespace: "{{ goat_addon.namespace }}"
        name: goat-keycloak-creds
      register: existing_keycloak_secret

    - name: "GOAT addon: reuse existing NEXTAUTH_SECRET if available"
      ansible.builtin.set_fact:
        nextauth_secret: "{{ existing_keycloak_secret.resources[0].data['nextauth-secret'] | b64decode }}"
      when:
        - existing_keycloak_secret.resources | length > 0
        - existing_keycloak_secret.resources[0].data['nextauth-secret'] is defined

    - name: "GOAT addon: generate a new NEXTAUTH_SECRET if none exists"
      ansible.builtin.set_fact:
        nextauth_secret: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
      when: nextauth_secret is not defined

- name: "GOAT addon: create or update goat-keycloak-creds K8s Secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: goat-keycloak-creds
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      type: Opaque
      stringData:
        server-url: "{{ inv_access.platform.hostname }}"
        realm: "{{ inv_access.tenant.realm_name }}"
        client-id: "{{ goat_addon.keycloak.client_id }}"
        client-secret: "{{ client_secret }}"
        nextauth-secret: "{{ nextauth_secret }}"

# Login gate (keycloak.limit_access). Role, group and flow are created
# when the flag is on and intentionally left in place when it is off.
# Only the client's browser-flow binding toggles both ways (last task).

- name: "GOAT addon: provision login gate resources"
  when: goat_addon.keycloak.limit_access | bool
  block:
    - name: "GOAT addon: create gate client role"
      uri:
        method: POST
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}/roles"
        body_format: json
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        body:
          name: "{{ goat_addon.keycloak.gate_role }}"
          description: "Grants login to GOAT while the login gate is enabled"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: [201, 409]

    - name: "GOAT addon: create gate group"
      uri:
        method: POST
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/groups"
        body_format: json
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        body:
          name: "{{ goat_addon.keycloak.gate_group }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: [201, 409]

    - name: "GOAT addon: fetch gate role representation"
      uri:
        method: GET
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}/roles/{{ goat_addon.keycloak.gate_role | urlencode }}"
        return_content: yes
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 200
      register: goat_gate_role

    - name: "GOAT addon: search gate group"
      uri:
        method: GET
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/groups?search={{ goat_addon.keycloak.gate_group | urlencode }}&exact=true"
        return_content: yes
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 200
      register: goat_gate_groups

    - name: "GOAT addon: extract gate group id"
      set_fact:
        goat_gate_group_id: "{{ goat_gate_groups.json | json_query(query) }}"
      vars:
        query: "[?name== '{{ goat_addon.keycloak.gate_group }}'].id | [0]"

    # Adding an already-present mapping is a no-op (204 either way).
    - name: "GOAT addon: map gate role onto gate group"
      uri:
        method: POST
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/groups/{{ goat_gate_group_id }}/role-mappings/clients/{{ client_id_goat }}"
        body_format: json
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        body: "{{ [goat_gate_role.json] }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 204

    - name: "GOAT addon: get authentication flows"
      uri:
        method: GET
        url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows"
        return_content: yes
        ca_path: "{{ inv_k8s.ingress.ca_path }}"
        headers:
          Accept: application/json
          Authorization: "Bearer {{ keycloak_login.json.access_token }}"
        status_code: 200
      register: goat_kc_flows

    # The multi-call build below is not self-idempotent. Re-running it
    # creates a second, broken flow instead of returning 409, so the
    # whole block is guarded by the alias existence check.
    - name: "GOAT addon: build gate browser flow"
      when: goat_addon.keycloak.flow_alias not in (goat_kc_flows.json | map(attribute='alias') | list)
      block:
        - name: "GOAT addon: create top-level gate flow"
          uri:
            method: POST
            url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows"
            body_format: json
            ca_path: "{{ inv_k8s.ingress.ca_path }}"
            body:
              alias: "{{ goat_addon.keycloak.flow_alias }}"
              description: "browser based authentication for goat"
              providerId: "basic-flow"
              topLevel: true
              builtIn: false
            headers:
              Accept: application/json
              Authorization: "Bearer {{ keycloak_login.json.access_token }}"
            status_code: 201

        - name: "GOAT addon: create gate flow subflows and executions"
          uri:
            method: POST
            url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows/{{ item.parent | urlencode }}/executions/{{ 'flow' if item.alias is defined else 'execution' }}"
            body_format: json
            ca_path: "{{ inv_k8s.ingress.ca_path }}"
            body: "{{ {'alias': item.alias, 'type': 'basic-flow'} if item.alias is defined else {'provider': item.provider} }}"
            headers:
              Accept: application/json
              Authorization: "Bearer {{ keycloak_login.json.access_token }}"
            status_code: 201
          loop: "{{ goat_kc_flow_executions }}"
          loop_control:
            label: "{{ item.parent }} / {{ item.alias | default(item.provider) }}"

        # Flattened list of every (nested) execution, with ids. Subflows
        # surface their alias as displayName. Executions surface their
        # providerId.
        - name: "GOAT addon: read created gate flow executions"
          uri:
            method: GET
            url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows/{{ goat_addon.keycloak.flow_alias | urlencode }}/executions"
            return_content: yes
            ca_path: "{{ inv_k8s.ingress.ca_path }}"
            headers:
              Accept: application/json
              Authorization: "Bearer {{ keycloak_login.json.access_token }}"
            status_code: 200
          register: goat_kc_flow_state

        # Freshly created executions default to DISABLED.
        - name: "GOAT addon: set gate flow execution requirements"
          uri:
            method: PUT
            url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows/{{ goat_addon.keycloak.flow_alias | urlencode }}/executions"
            body_format: json
            ca_path: "{{ inv_k8s.ingress.ca_path }}"
            body: "{{ goat_kc_exec_rep | combine({'requirement': item.requirement}) }}"
            headers:
              Accept: application/json
              Authorization: "Bearer {{ keycloak_login.json.access_token }}"
            status_code: 204
          loop: "{{ goat_kc_flow_executions }}"
          loop_control:
            label: "{{ item.alias | default(item.provider) }} {{ item.requirement }}"

        - name: "GOAT addon: configure gate flow executions"
          uri:
            method: POST
            url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/executions/{{ goat_kc_exec_rep.id }}/config"
            body_format: json
            ca_path: "{{ inv_k8s.ingress.ca_path }}"
            body: "{{ item.config }}"
            headers:
              Accept: application/json
              Authorization: "Bearer {{ keycloak_login.json.access_token }}"
            status_code: 201
          loop: "{{ goat_kc_flow_executions | selectattr('config', 'defined') | list }}"
          loop_control:
            label: "{{ item.config.alias }}"
      vars:
        goat_kc_exec_rep: >-
          {{ ((goat_kc_flow_state.json | default([])
               | selectattr('displayName', 'defined')
               | selectattr('displayName', 'equalto', item.alias | default('')) | list)
             + (goat_kc_flow_state.json | default([])
               | selectattr('providerId', 'defined')
               | selectattr('providerId', 'equalto', item.provider | default('')) | list))
             | first }}

# Binding runs unconditionally so turning the flag off unbinds the flow.
# Ordered after the full-representation client PUT above so every
# converge ends with the binding matching the flag.
- name: "GOAT addon: get authentication flows for binding"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: goat_kc_flows_current
  when: goat_addon.keycloak.limit_access | bool

- name: "GOAT addon: read full goat-web client representation"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: goat_kc_client_rep

- name: "GOAT addon: resolve gate flow id"
  set_fact:
    goat_kc_flow_id: >-
      {{ (goat_kc_flows_current.json | default([])
          | selectattr('alias', 'equalto', goat_addon.keycloak.flow_alias)
          | map(attribute='id') | first | default(''))
         if goat_addon.keycloak.limit_access | bool else '' }}

# The binding must never point at a missing or half-built flow. A run that
# fails inside the build loop leaves the alias behind, so a retry skips the
# build block and would otherwise bind an incomplete flow, locking everyone
# out. The GET fails loudly on a missing flow, the assert on an incomplete
# one.
- name: "GOAT addon: read gate flow executions"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/authentication/flows/{{ goat_addon.keycloak.flow_alias | urlencode }}/executions"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 200
  register: goat_kc_flow_exec_state
  when: goat_addon.keycloak.limit_access | bool

- name: "GOAT addon: assert gate flow is bindable"
  assert:
    that:
      - goat_kc_flow_id | length > 0
      - goat_kc_flow_exec_state.json | length == goat_kc_flow_executions | length
    fail_msg: >-
      Flow '{{ goat_addon.keycloak.flow_alias }}' is incomplete
      ({{ goat_kc_flow_exec_state.json | length }} of
      {{ goat_kc_flow_executions | length }} executions). Refusing to bind it.
      Delete the flow in the Keycloak admin console and re-run.
  when: goat_addon.keycloak.limit_access | bool

# Full representation PUT. Keycloak's merge behaviour on partial
# representations is not stable across versions.
- name: "GOAT addon: toggle browser flow binding on goat-web client"
  uri:
    method: PUT
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}"
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body: "{{ goat_kc_client_rep.json | combine({'authenticationFlowBindingOverrides': goat_kc_desired_overrides}) }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 204
  # Keycloak keeps override keys that are missing from a PUT, so dropping
  # `browser` from the map never unbinds the gate. An empty value does.
  when: goat_kc_current_browser != goat_kc_desired_browser
  vars:
    goat_kc_current_overrides: "{{ goat_kc_client_rep.json.authenticationFlowBindingOverrides | default({}) }}"
    goat_kc_current_browser: "{{ goat_kc_current_overrides.browser | default('') }}"
    goat_kc_desired_browser: "{{ goat_kc_flow_id if goat_addon.keycloak.limit_access | bool else '' }}"
    goat_kc_desired_overrides: "{{ goat_kc_current_overrides | combine({'browser': goat_kc_desired_browser}) }}"
