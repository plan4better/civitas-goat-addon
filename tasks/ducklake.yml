---
# The shared data volume. Chart 0.5.x mounts it (`data.existingClaim` in
# goat_values.yml) at /app/data on geoapi, processes, catalog, core and the
# tools/workflows workers. It holds the DuckLake parquet -- every user layer
# is stored here, not in S3 -- plus the catalog mirror and the routing base
# data, so back it up and size it for the layer data.
#
# The DuckLake catalog itself is created by the chart: an init container on
# geoapi and processes runs goatlib's idempotent bootstrap from the same image
# the services run, so the catalog format always matches the DuckDB version.

- name: "GOAT addon: create shared DuckLake data PVC"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: goat-ducklake-data
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        accessModes:
          - "{{ goat_addon.ducklake.pvc_access_mode | default('ReadWriteMany') }}"
        storageClassName: "{{ goat_addon.ducklake.storage_class }}"
        resources:
          requests:
            storage: "{{ goat_addon.ducklake.pvc_size | default('20Gi') }}"
